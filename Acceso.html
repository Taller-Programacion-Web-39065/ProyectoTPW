<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Segusa Design</title>
    <link rel="stylesheet" href="Acceso.css">
</head>
<body>
    <header class="HeaderA">
        <a href="index.html" class="Logo">
            <img src="logo.jpg" alt="Logo Segusa Design">
        </a>
    </header>

    <main class="login-container">
        <form class="login-form" method="get">
            <h2>Iniciar Sesión</h2>
            
            <div class="input-group">
                <label for="idUsuario">Usuario</label>
                <input type="text" id="idUsuario" name="Usuario" placeholder="Ingrese su Usuario" required>
            </div>

            <div class="input-group">
                <label for="idPassword">Contraseña</label>
                <input type="password" id="idPassword" name="Contraseña" placeholder="Ingrese su contraseña" required>    
                <a href="recuperar.html" class="forgot-password">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-ingresar">
                Ingresar
            </button>

            <div class="rv">
                <a href="Registrarte.html">Crear una cuenta nueva</a>
                <a href="index.html">Volver al inicio</a>
            </div>
        </form>
    </main>
</body>
</html>
